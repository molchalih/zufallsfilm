# CI for zufallsfilm. PRs run the fast checks; pushes to main additionally build,
# keyless-cosign-sign and push the image to GHCR. GitHub-hosted runners only
# (ephemeral, isolated, no path into the perimeter).
#
# The release job is what the 240.agency svc01 deployment consumes: it follows the
# `:main` channel tag, resolves it to an immutable digest, and refuses to deploy a
# digest this workflow's OIDC identity did not sign.
# Actions are SHA-PINNED, not tag-pinned: a mutable tag is a supply-chain hole, and
# `@v4`-style major tags are not always published (cosign-installer has none, which
# is how the first release run failed). These are the same pins the fleet's other
# signed-image repos use.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded push must not race the one before it: two in-flight runs can leave `:main` pointing at
# the OLDER digest. PRs cancel freely; a push to main does NOT, because cancelling between the image
# push and the cosign sign would publish an unsigned digest the fleet then refuses.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/molchalih/zufallsfilm

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run bundle
      - run: bun test

  # ── release (main only): build, sign, push ─────────────────────────────────
  release:
    if: github.event_name == 'push'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to GHCR
      id-token: write      # keyless cosign OIDC
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Sign the DIGEST, never the moving tag: the deployment verifies the digest it
      # resolved, so a signature bound to `:main` would prove nothing about it.
      - name: Cosign sign (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      # Prove the signature the FLEET will check, with its exact pinned regexp
      # (zufallsfilm_podman_cosign_identity_regexp). Verification on the fleet is fail-closed, so any
      # drift in this workflow's filename or branch would otherwise surface only as a silently
      # un-deployable image. This turns that into a red build here.
      - name: Verify the signature the fleet will check
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/molchalih/zufallsfilm/\.github/workflows/ci\.yml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
