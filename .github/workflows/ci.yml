# CI for zufallsfilm. PRs run the fast checks; pushes to main additionally build,
# keyless-cosign-sign and push the image to GHCR. GitHub-hosted runners only
# (ephemeral, isolated, no path into the perimeter).
#
# The release job is what the 240.agency svc01 deployment consumes: it follows the
# `:main` channel tag, resolves it to an immutable digest, and refuses to deploy a
# digest this workflow's OIDC identity did not sign.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/molchalih/zufallsfilm

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run bundle
      - run: bun test

  # ── release (main only): build, sign, push ─────────────────────────────────
  release:
    if: github.event_name == 'push'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to GHCR
      id-token: write      # keyless cosign OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - uses: sigstore/cosign-installer@v4
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Sign the DIGEST, never the moving tag: the deployment verifies the digest it
      # resolved, so a signature bound to `:main` would prove nothing about it.
      - name: Cosign sign (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
