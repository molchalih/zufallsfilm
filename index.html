<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zufallsfilm</title>
    <meta
      name="description"
      content="A random film from your Letterboxd watchlist."
    />

    <!-- The link preview messengers and search engines show. A crawler runs no
         script and resolves nothing relative, so every URL here is absolute and
         the origin is repeated literally: there is no build step to inject it,
         and one wrong host renders a card with no image at all. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="zufallsfilm" />
    <meta property="og:url" content="https://zufalls.film/" />
    <meta property="og:title" content="zufallsfilm" />
    <meta
      property="og:description"
      content="A random film from your Letterboxd watchlist."
    />
    <meta property="og:image" content="https://zufalls.film/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The zufallsfilm wordmark over the line: a random film from your Letterboxd watchlist."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://zufalls.film/" />

    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f2f1ec" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f2f1ec'/%3E%3Crect x='10' y='10' width='12' height='12' fill='%23e0201b'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p
        style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 40px"
      >
        This picker needs JavaScript. The API behind it does not:
        <code>GET /pick?user=&lt;username&gt;</code>.
      </p>
    </noscript>
    <script type="module" src="./src/web/main.tsx"></script>
  </body>
</html>
